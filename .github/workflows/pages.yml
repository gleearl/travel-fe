name: Deploy to Pages

# `push` publishes. `pull_request` runs the tests and the build before the
# merge rather than after it — a failure found on main is a failure found with
# main already broken, and Pages left serving the last good build with no sign
# that the next one did not make it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and don't cancel one halfway. Keyed by ref so a pull
# request checks itself without queueing behind — or holding up — a publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The gate. Shipping an app that can't add a place is worse than not
      # shipping.
      - name: Tests
        run: npm test

      # VITE_API_URL comes from .env.production, so the API's origin is in the
      # repo rather than in this file — one place to change it.
      - name: Build
        run: npm run build

      # Pages has no SPA fallback: it serves a file or it 404s. Handing the app
      # shell back as the 404 body is what lets /travel-fe/trips/7 survive a
      # hard refresh — React Router reads the URL and renders the right screen.
      - name: Fall back to the app shell
        run: cp dist/index.html dist/404.html

      # Everything above runs on a pull request; nothing below it does. A PR is
      # asking whether this is safe to merge, not asking to be published.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
