<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Guide — trips and places</title>
<meta name="description" content="Plan trips, save the places you want to go, and see them all on one map.">
<meta name="theme-color" content="#faf7f2">
<link rel="icon" href="%BASE_URL%favicon.svg">
<script>
  /* Light or dark, settled before the first paint so a dark page never
     flashes cream first. The same rule as src/lib/theme.ts, which takes
     over once the app loads. */
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("fieldguide.theme"); } catch (e) {}
    var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#171512");
  })();
</script>
<script type="module" src="/src/main.tsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
